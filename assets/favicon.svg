<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tab mark. Same wordmark as the nav ("PU."), same glass tile and the one
       locked accent, so the tab reads as this site at 16px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232B"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#g)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
  <text x="30" y="44" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1.5"
        text-anchor="middle" fill="#F5F5F7">PU</text>
  <circle cx="52" cy="41" r="4" fill="#0A84FF"/>
</svg>
